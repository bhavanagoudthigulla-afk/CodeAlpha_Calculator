
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <div class="top">
            <div class="brand">
                <span class="brand-icon">✦</span>
                <span>SMART CALC</span>
            </div>
            <span class="status">● READY</span>
        </div>

        <section class="screen">
            <div id="history" class="history">Ready to calculate</div>
            <div id="display" class="display" aria-live="polite">0</div>
        </section>

        <section class="buttons">
            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="delete">DEL</button>
            <button class="utility" data-action="percent">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="utility" data-action="sign">+/−</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="equals">=</button>
        </section>

        <p class="footer">PRECISION IN EVERY CALCULATION</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
